<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Swarup's Science Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one centred column (max 880px) with a floating pill tab bar. Every tab owns one colour so a child always knows where he is. */
:root{
  --bg:#EDF6F8; --surface:#FFFFFF; --surface-2:#E0EEF2; --ink:#11304A; --ink-soft:#4A6478; --line:#CBDDE5;
  --green:#17824F; --green-bg:#DCF4E7; --on-green:#FFFFFF;
  --blue:#3659CC; --blue-bg:#E1E8FC; --on-blue:#FFFFFF;
  --coral:#C23520; --coral-bg:#FFE2DB; --on-coral:#FFFFFF;
  --sun:#F2B01E; --sun-bg:#FFF0C7; --on-sun:#3A2800; --sun-ink:#7A5200;
  --violet:#6A47D6; --violet-bg:#E9E2FC; --on-violet:#FFFFFF;
  --egg:#FFF4D9; --egg-line:#E3C98C; --shell:#E8CDA0; --albumen:#FFFDF5; --yolk:#FFAE1A;
  --good:#17824F; --bad:#C23520;
  --shadow:0 2px 0 rgba(17,48,74,.07),0 10px 24px -14px rgba(17,48,74,.35);
  --f-display:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A26; --surface:#13293A; --surface-2:#1A3448; --ink:#E9F4F9; --ink-soft:#A0B9C9; --line:#2A4A60;
    --green:#4FD08C; --green-bg:#12382A; --on-green:#062218;
    --blue:#8DA8FF; --blue-bg:#1A2A58; --on-blue:#0A1030;
    --coral:#FF8D7A; --coral-bg:#4A2019; --on-coral:#2B0A04;
    --sun:#FFCB52; --sun-bg:#4A3A10; --on-sun:#2B1D00; --sun-ink:#FFD777;
    --violet:#B8A3FF; --violet-bg:#2E2560; --on-violet:#150B3A;
    --egg:#F6E8C6; --egg-line:#CDB57C; --good:#4FD08C; --bad:#FF8D7A;
    --shadow:0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A26; --surface:#13293A; --surface-2:#1A3448; --ink:#E9F4F9; --ink-soft:#A0B9C9; --line:#2A4A60;
  --green:#4FD08C; --green-bg:#12382A; --on-green:#062218;
  --blue:#8DA8FF; --blue-bg:#1A2A58; --on-blue:#0A1030;
  --coral:#FF8D7A; --coral-bg:#4A2019; --on-coral:#2B0A04;
  --sun:#FFCB52; --sun-bg:#4A3A10; --on-sun:#2B1D00; --sun-ink:#FFD777;
  --violet:#B8A3FF; --violet-bg:#2E2560; --on-violet:#150B3A;
  --egg:#F6E8C6; --egg-line:#CDB57C; --good:#4FD08C; --bad:#FF8D7A;
  --shadow:0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
body{
  background:var(--bg); color:var(--ink); font:500 17px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 130px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(32px,8vw,48px);font-weight:800}
h2{font-size:clamp(25px,6vw,32px);font-weight:800}
h3{font-size:21px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow{font:800 13px/1.3 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ct,var(--ink-soft))}
.lead{font-size:19px;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}

/* colour themes per area */
.t-green{--c:var(--green);--cbg:var(--green-bg);--on:var(--on-green);--ct:var(--green)}
.t-blue{--c:var(--blue);--cbg:var(--blue-bg);--on:var(--on-blue);--ct:var(--blue)}
.t-coral{--c:var(--coral);--cbg:var(--coral-bg);--on:var(--on-coral);--ct:var(--coral)}
.t-sun{--c:var(--sun);--cbg:var(--sun-bg);--on:var(--on-sun);--ct:var(--sun-ink)}
.t-violet{--c:var(--violet);--cbg:var(--violet-bg);--on:var(--on-violet);--ct:var(--violet)}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid var(--c,var(--green));background:var(--c,var(--green));color:var(--on,var(--on-green));font-weight:800;cursor:pointer;transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:none;min-height:42px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--c,var(--green));border-color:var(--c,var(--green));color:var(--on,var(--on-green))}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.tint{background:var(--cbg);border-color:transparent;box-shadow:none}
.sec-head{display:flex;flex-direction:column;gap:6px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;background:var(--cbg);border-radius:28px;padding:clamp(18px,4vw,34px)}
.hero-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.egg-stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.egg{position:relative;width:min(220px,60vw);aspect-ratio:200/240;border:0;background:none;padding:0;cursor:pointer}
.egg-svg{width:100%;height:100%;overflow:visible}
.egg .shell{fill:var(--egg);stroke:var(--egg-line);stroke-width:4}
.egg .speck circle{fill:var(--egg-line);opacity:.7}
.egg-top{transform-origin:100px 130px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.egg.open .egg-top{transform:translate(-18px,-38px) rotate(-20deg)}
.egg:not(.open){animation:wobble 2.6s ease-in-out infinite;transform-origin:50% 90%}
.baby{position:absolute;left:50%;top:50%;font-size:76px;line-height:1;opacity:0;transform:translate(-50%,-10%) scale(.3);transition:transform .5s cubic-bezier(.3,1.6,.5,1) .12s,opacity .2s}
.egg.open .baby{opacity:1;transform:translate(-50%,-72%) scale(1)}
.egg-card{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;text-align:center;min-height:84px;width:100%;max-width:340px}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}68%{transform:rotate(-5deg)}76%{transform:rotate(5deg)}84%{transform:rotate(-3deg)}92%{transform:rotate(2deg)}}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.go-card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:var(--r);border:0;background:var(--cbg);cursor:pointer;min-width:0;transition:transform .15s}
.go-card:hover{transform:translateY(-3px)}
.go-card .ic{width:44px;height:44px;border-radius:12px;background:var(--c);color:var(--on);display:grid;place-items:center}
.go-card h3{color:var(--ink)}
.go-card p{color:var(--ink-soft);font-size:15px;line-height:1.4}
.two-ways{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.way{border-radius:var(--r);padding:18px;background:var(--cbg);display:flex;flex-direction:column;gap:8px;min-width:0}
.way .big{font-size:42px;line-height:1}
.fact{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fact p{flex:1 1 260px;font-size:19px;font-weight:700}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs{pointer-events:auto;width:min(100%,580px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px;background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border:0;border-radius:20px;background:transparent;cursor:pointer;font:800 12px/1.1 var(--f-body);color:var(--ink-soft);min-width:0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--c);color:var(--on)}

/* ---------- learn ---------- */
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px 0}
.lsec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:70px}
.lsec>.sec-head h2{color:var(--ink)}
.remember{display:flex;gap:12px;align-items:flex-start;background:var(--cbg);border-radius:14px;padding:14px 16px;font-weight:700}
.remember b{flex:none;background:var(--c);color:var(--on);border-radius:8px;padding:2px 10px;font:800 13px/1.6 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:800;text-align:center}
.tile span.e{font-size:36px;line-height:1}
.tile small{font-weight:600;color:var(--ink-soft);font-size:13px}
.explorer{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px;align-items:center}
.egg-x{width:100%;max-width:260px;margin:0 auto;display:block}
.egg-x .part{cursor:pointer;transition:opacity .2s}
.egg-x[data-sel="shell"] .p-shell,.egg-x[data-sel="albumen"] .p-albumen,.egg-x[data-sel="yolk"] .p-yolk,.egg-x[data-sel="spot"] .p-spot{stroke:var(--ink);stroke-width:5}
.egg-x[data-sel="yolk"] .p-spot,.egg-x[data-sel="albumen"] .p-yolk{opacity:.85}
.baby svg{width:76px;height:76px;display:block}
.part-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.part-info .box{background:var(--cbg);border-radius:14px;padding:14px 16px;min-height:130px}
.part-info h3{color:var(--ct)}
/* life cycle ring */
.lc{display:flex;flex-direction:column;gap:14px;align-items:center}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:min(100%,420px);aspect-ratio:1}
.ring-svg{position:absolute;inset:0;width:100%;height:100%}
.ring-svg path{fill:none;stroke:var(--ink-soft);stroke-width:.9;stroke-dasharray:2.2 1.8;opacity:.8}
.ring-center{position:absolute;inset:31%;display:grid;place-items:center;text-align:center;font:800 clamp(14px,3.6vw,18px)/1.15 var(--f-display);color:var(--ct)}
.node{position:absolute;width:23%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.node.on{border-color:var(--c);background:var(--cbg);box-shadow:0 0 0 3px var(--c)}
.node .vis{width:min(52px,11vw);height:min(52px,11vw);display:grid;place-items:center;font-size:clamp(26px,7vw,40px);line-height:1}
.node .vis svg{width:100%;height:100%}
.node .vis.small{font-size:clamp(18px,4.6vw,26px)}
.node .cap{font:800 clamp(10.5px,2.8vw,12.5px)/1.15 var(--f-body);text-align:center;overflow-wrap:anywhere}
.lc-panel{width:100%;background:var(--cbg);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.lc-panel h3{color:var(--ink)}
.kw{align-self:flex-start;background:var(--c);color:var(--on);border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px}
.lc-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp>div{border-radius:14px;padding:14px;background:var(--cbg);min-width:0}
.cmp h4{font-size:18px;margin-bottom:6px;color:var(--ink)}
.cmp ul,.bul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.word{display:flex;flex-direction:column;gap:6px}
.word h4{font-size:22px;color:var(--ct)}
.word .kid{background:var(--cbg);border-radius:10px;padding:8px 12px;font-weight:700;font-size:15.5px}
.story{display:flex;flex-direction:column;gap:12px}
.moral{background:var(--c);color:var(--on);border-radius:14px;padding:14px 18px;font:800 20px/1.25 var(--f-display)}

/* ---------- Q&A ---------- */
.qa-group{display:flex;flex-direction:column;gap:12px}
.qa-group>.sec-head{padding-left:14px;border-left:6px solid var(--c)}
.qa{display:flex;flex-direction:column;gap:12px}
.qa-head{display:flex;gap:12px;align-items:flex-start}
.qa-n{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--cbg);color:var(--ct);display:grid;place-items:center;font:800 15px var(--f-display);padding:0 6px}
.qa-q{font-weight:700;font-size:18px;padding-top:6px}
.blank{display:inline-block;min-width:110px;border-bottom:3px dashed var(--ink-soft);text-align:center;font-weight:800;color:var(--ink-soft)}
.qa.open .blank{border-bottom-style:solid;color:var(--good);border-color:var(--good)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.opt i{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:800 13px var(--f-body);font-style:normal}
.opt.right{border-color:var(--good);background:var(--green-bg)}
.opt.right i{background:var(--good);color:var(--on-green)}
.opt.wrong{border-color:var(--bad);background:var(--coral-bg)}
.opt.wrong i{background:var(--bad);color:var(--on-coral)}
.qa-a{display:none;background:var(--green-bg);border-radius:14px;padding:12px 16px;flex-direction:column;gap:8px}
.qa.open .qa-a{display:flex}
.qa-a b.lab{font:800 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.qa-a .ans{font-weight:800;font-size:19px}
.tag-extra{align-self:flex-start;font:800 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--sun-bg);color:var(--sun-ink);padding:2px 10px;border-radius:999px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:520px;width:100%;font-size:15.5px}
.tbl th,.tbl td{border:2px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;background:var(--surface)}
.tbl th{background:var(--surface-2);font-family:var(--f-display);font-size:17px}
.cmap{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.cm-top{align-self:center;background:var(--coral);color:var(--on-coral);padding:8px 18px;border-radius:12px;font:800 17px var(--f-display);text-align:center}
.cm-cols{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.cm-col{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.cm-pill{align-self:center;background:var(--green);color:var(--on-green);border-radius:10px;padding:4px 14px;font-weight:800;font-size:15px}
.cm-box{align-self:center;background:var(--blue);color:var(--on-blue);border-radius:10px;padding:6px 14px;font-weight:800;text-align:center}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cm-b{background:var(--sun);color:var(--on-sun);border-radius:10px;padding:5px 8px;font-weight:800;text-align:center;font-size:15px}
.cm-ex{border:2px dashed var(--ink-soft);border-radius:10px;padding:6px 8px;font-size:14.5px;margin-top:6px;text-align:center;background:var(--surface)}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pair{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700}
.pair .e{font-size:28px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.flow>div{background:var(--surface);border-radius:12px;padding:10px 12px}
.flow b{color:var(--ct)}

/* ---------- Quiz ---------- */
.q-top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1 1 140px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);font:800 12px var(--f-body);cursor:pointer;padding:0}
.dot.cur{border-color:var(--ink)}
.dot.ok{background:var(--good);border-color:var(--good);color:var(--on-green)}
.dot.no{background:var(--bad);border-color:var(--bad);color:var(--on-coral)}
.q-card{display:flex;flex-direction:column;gap:16px}
.q-text{font:700 clamp(21px,5vw,26px)/1.25 var(--f-display)}
.q-opts{display:grid;gap:10px}
.q-opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;font-weight:700;font-size:18px;cursor:pointer}
.q-opt i{flex:none;width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:800 15px var(--f-body);font-style:normal}
.q-opt:not(:disabled):hover{border-color:var(--c)}
.q-opt:disabled{cursor:default}
.q-opt.right{border-color:var(--good);background:var(--green-bg)}
.q-opt.right i{background:var(--good);color:var(--on-green)}
.q-opt.wrong{border-color:var(--bad);background:var(--coral-bg)}
.q-opt.wrong i{background:var(--bad);color:var(--on-coral)}
.fb{border-radius:14px;padding:12px 16px;font-weight:700}
.fb.ok{background:var(--green-bg)} .fb.no{background:var(--coral-bg)}
.fb b{display:block;font:800 19px var(--f-display)}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.size{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r);background:var(--cbg);border:0;text-align:left;cursor:pointer}
.size b{font:800 34px/1 var(--f-display);color:var(--ct)}
.stars{display:flex;gap:6px;justify-content:center;font-size:0}
.stars svg{width:54px;height:54px;fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.stars svg.on{fill:var(--sun);stroke:var(--sun-ink)}
.score{font:800 clamp(44px,12vw,72px)/1 var(--f-display);text-align:center}
.miss{display:flex;flex-direction:column;gap:8px}
.miss>div{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.miss .rt{color:var(--good);font-weight:800}

/* ---------- Play ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.g-card{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r);background:var(--cbg);border:0;text-align:left;cursor:pointer;min-width:0;transition:transform .15s}
.g-card:hover{transform:translateY(-3px)}
.g-card .e{font-size:40px;line-height:1}
.g-card p{color:var(--ink-soft);font-size:15px;line-height:1.4}
.g-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.big-e{font-size:96px;line-height:1;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:64px;font-size:20px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}

.mbtn.sel{border-color:var(--c);background:var(--cbg);box-shadow:0 0 0 3px var(--c)}
.mbtn.done{border-color:var(--good);background:var(--green-bg);cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;gap:8px;flex-wrap:wrap;min-height:84px}
.slot{width:calc(20% - 7px);min-width:62px;min-height:84px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-weight:800;font-size:12px;text-align:center}
.slot.f{border-style:solid;border-color:var(--good);background:var(--green-bg)}
.slot .vis{width:40px;height:40px;display:grid;place-items:center;font-size:30px;line-height:1}
.slot .vis svg{width:100%;height:100%}
.pool{display:flex;gap:10px;flex-wrap:wrap}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;cursor:pointer}
.pbtn .vis{width:46px;height:46px;display:grid;place-items:center;font-size:34px;line-height:1}
.pbtn .vis svg{width:100%;height:100%}
.xw-wrap{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:18px;align-items:start}
.xw{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;width:100%}
.xc{position:relative;aspect-ratio:1}
.xc input{width:100%;height:100%;padding:0;text-align:center;text-transform:uppercase;font:800 clamp(18px,6vw,28px) var(--f-display);border:2px solid var(--ink-soft);border-radius:8px;background:var(--surface);color:var(--ink);caret-color:transparent}
.xc input.act{background:var(--violet-bg)}
.xc input.cur{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet)}
.xc input.ok{background:var(--green-bg);border-color:var(--good)}
.xc input.no{background:var(--coral-bg);border-color:var(--bad)}
.xn{position:absolute;top:1px;left:4px;font:800 11px var(--f-body);color:var(--ink-soft);pointer-events:none}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{display:flex;gap:10px;text-align:left;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.clue b{color:var(--ct);min-width:28px}
.rid{display:flex;flex-direction:column;gap:10px}
.rid input[type=text],.notes{font:600 18px var(--f-body);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:48px}
.rid .msg{font-weight:800;min-height:26px}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)} .msg.hint{color:var(--ink-soft)}
.det-q{font:700 clamp(22px,5vw,28px)/1.25 var(--f-display);text-align:center}
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--green);flex:none}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.9}}

@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .explorer,.xw-wrap,.cmp,.cm-cols{grid-template-columns:1fr}
  .two-ways{grid-template-columns:1fr}
  .slot{width:calc(33.3% - 6px)}
}
@media (max-width:420px){.match{gap:8px}.mbtn{font-size:15px;padding:6px}}
@media (prefers-reduced-motion:reduce){

}

.scene{display:block;width:100%;height:auto;aspect-ratio:400/130}
.scene-wrap{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);line-height:0}
.way .big svg,.tile span.e svg{width:56px;height:56px;display:block}
.tile span.e{display:grid;place-items:center;min-height:56px}
.ring-center{inset:29%;font-size:0}
.ring-art{width:100%;aspect-ratio:1;border-radius:50%;background:var(--cbg);display:grid;place-items:center;padding:10%;animation:pop .35s ease-out}
.ring-art svg{width:100%;height:100%}
@keyframes pop{from{transform:scale(.8);opacity:.3}}
.lc-panel{flex-direction:row;align-items:center;gap:16px}
.lc-panel .pa{flex:none;width:104px;height:104px;border-radius:20px;background:var(--surface);display:grid;place-items:center;padding:8px}
.lc-panel .pa svg{width:100%;height:100%}
.lc-panel .pt{display:flex;flex-direction:column;gap:6px;min-width:0}
.g-card .ga{width:56px;height:56px;display:block}
.ftree{display:flex;flex-direction:column;gap:10px}
.ft-q{background:var(--blue);color:var(--on-blue);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center}
.ft-q.s{background:var(--surface);color:var(--ink);border:2px solid var(--blue)}
.ft-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ft-col{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface-2);border-radius:14px;padding:10px}
.ft-yn{align-self:flex-start;font:800 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 12px;border-radius:99px}
.ft-yn.y{background:var(--good);color:var(--on-green)}
.ft-yn.n{background:var(--bad);color:var(--on-coral)}
.ft-res{display:flex;align-items:center;gap:8px}
.ft-card{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--good);border-radius:14px;padding:6px 10px;font-weight:800;min-width:0}

    var st = d.stages[s.i];
    $('.lc-panel', root).innerHTML = '<div class="pa">' + st.v + '</div><div class="pt"><p class="eyebrow" style="color:var(--ct)">Stage ' + (s.i + 1) + ' of ' + n + '</p><h3>' + esc(st.t) + '</h3>' + (st.kw ? '<span class="kw">' + esc(st.kw) + '</span>' : '') + '<p>' + esc(st.d) + '</p>' + (d.fact && s.i === n - 1 ? '<p class="muted" style="font-size:15px;margin-top:4px">' + esc(d.fact) + '</p>' : '') + '</div>';
    var pb = $('[data-act="lcplay"]', root); if (pb) pb.textContent = s.timer ? 'Pause' : 'Play';
  }
  function lcStop(id) { var s = LCS[id]; if (s && s.timer) { clearInterval(s.timer); s.timer = null; } }
  function lcStep(id, dir) { var s = LCS[id], n = D.LC[s.key].stages.length; s.i = (s.i + dir + n) % n; lcRender(id); }
  S.ACT.lcnode = function (t) { var id = t.dataset.id; lcStop(id); LCS[id].i = +t.dataset.i; lcRender(id); };
  S.ACT.lcnext = function (t) { lcStop(t.dataset.id); lcStep(t.dataset.id, 1); };

  };
  S.ACT.lckey = function (t) {

  /* ----- egg explorer ----- */

    '<path class="part p-shell" data-act="part" data-p="shell" d="M120 10C175 10 222 100 222 175 222 245 176 290 120 290 64 290 18 245 18 175 18 100 65 10 120 10Z" fill="var(--shell)" stroke="#B9965E" stroke-width="3"/>' +
    '<path class="part p-albumen" data-act="part" data-p="albumen" d="M120 10C175 10 222 100 222 175 222 245 176 290 120 290 64 290 18 245 18 175 18 100 65 10 120 10Z" transform="translate(120 160) scale(.88) translate(-120 -160)" fill="var(--albumen)" stroke="#D9D2BE" stroke-width="2"/>' +
    '<circle class="part p-yolk" data-act="part" data-p="yolk" cx="120" cy="178" r="56" fill="var(--yolk)" stroke="#E08A00" stroke-width="3"/>' +
    '<circle class="part p-spot" data-act="part" data-p="spot" cx="120" cy="156" r="13" fill="#fff" stroke="#E7D9B0" stroke-width="2"/></svg>';
  function showPart(p) {

  var head = function (eyebrow, title) { return '<div class="sec-head"><p class="eyebrow">' + eyebrow + '</p><h2>' + title + '</h2></div>'; };

  var NAV = [['l-why', 'Why babies?'], ['l-eggs', 'Egg-layers'], ['l-birds', 'Birds'], ['l-frog', 'Frogs'], ['l-insects', 'Insects'], ['l-reptiles', 'Reptiles'], ['l-mammals', 'Mammals'], ['l-words', 'Key words'], ['l-story', 'Story']];

  S.VIEWS.learn = function () {
    return '' +
      '<div class="sec-head"><p class="eyebrow">Learn</p><h1>Easy ideas, one at a time</h1><p class="lead">Tap the pictures. Press Play on the life cycles. Read in any order.</p></div>' +
      '<div class="subnav"><div class="chips">' + NAV.map(function (n) { return '<button class="chip" data-act="jump" data-to="' + n[0] + '" aria-pressed="false">' + n[1] + '</button>'; }).join('') + '</div></div>' +

      /* why */
      '<section class="lsec t-green" id="l-why">' + head('Idea 1', 'Why do animals have babies?') + sc('home') +
      '<div class="card"><p>All living things breathe, eat and grow. They also have babies. Making babies is called <b>reproduction</b>.</p><p style="margin-top:10px">If animals did not make babies, their kind would disappear from the Earth one day. So reproduction keeps life going.</p></div>' +
      '<div class="two-ways"><div class="way t-sun"><span class="big">' + window.ART.svg('egg') + '</span><h3>Way 1: lay eggs</h3><p>The babies hatch out of eggs.</p></div><div class="way t-blue"><span class="big">' + window.ART.svg('kangaroo') + '</span><h3>Way 2: give birth</h3><p>The babies are born alive.</p></div></div>' +
      remember('Reproduction means making young ones. Animals do it in two ways: lay eggs or give birth.') + '</section>' +

      /* egg layers */
      '<section class="lsec t-sun" id="l-eggs">' + head('Idea 2', 'Egg-laying animals') + sc('birds') +
      '<div class="card"><p>Animals that lay eggs are called <b>egg-laying animals</b>. They put their eggs in a safe place. Some of them sit on the eggs to keep them warm. When the time is right, the egg breaks and the baby comes out.</p>' +
      '<p style="margin-top:10px">The <b>embryo</b> is the baby that is still growing inside the egg. The journey of an embryo growing into a young one is the <b>life cycle</b> of that animal.</p></div>' +
      '<div class="tiles">' + [['art:hen', 'Birds', 'hen'], ['🐟', 'Fish', 'hundreds of eggs'], ['art:turtle', 'Turtles', 'hard shells'], ['art:frog', 'Frogs', 'in water'], ['🐍', 'Reptiles', 'in a hole'], ['art:butterfly', 'Insects', 'all of them']].map(function (t) { return '<div class="tile"><span class="e">' + tileE(t[0]) + '</span>' + t[1] + '<small>' + t[2] + '</small></div>'; }).join('') + '</div>' +
      remember('The life cycle is the journey from an embryo to a grown-up animal.') + '</section>' +

      /* birds */
      '<section class="lsec t-sun" id="l-birds">' + head('Idea 3', 'Birds and the egg') +
      '<div class="card"><p>Most birds lay eggs in a nest. A parent usually sits on the eggs to keep them warm. This is called <b>incubation</b>. It helps the baby inside to grow. When the baby is ready, the chick breaks the shell and comes out. This is called <b>hatching</b>.</p></div>' +
      '<div class="card"><h3>Look inside a bird\'s egg</h3><p class="muted" style="margin-bottom:12px">Tap a part of the egg.</p><div class="explorer">' + EGGX +
      '<div class="part-info"><div class="chips" style="flex-wrap:wrap;overflow:visible">' + Object.keys(PARTS).map(function (k) { return '<button class="chip" data-act="part" data-p="' + k + '" aria-pressed="' + (k === 'yolk') + '">' + PARTS[k][0].split(' (')[0] + '</button>'; }).join('') + '</div><div class="box" id="partBox"></div></div></div></div>' +
      '<div class="card"><h3>Life cycle of a hen</h3>' + lcHTML('lc-hen', ['hen']) + '</div>' +
      remember('Incubation keeps eggs warm. Hatching is breaking out of the egg.') + '</section>' +

      /* frog */
      '<section class="lsec t-green" id="l-frog">' + head('Idea 4', 'Water animals: the frog') + sc('frog') +
      '<div class="card"><p>Many water animals, like frogs and fish, lay eggs too. A fish lays hundreds of eggs at a time, but only a few become baby fish.</p><p style="margin-top:10px">A frog lays eggs in water or wet places. The eggs float in a big cluster called <b>frogspawn</b>. A tiny <b>tadpole</b> hatches out. It looks like a fish. It has a tail and breathes with gills. Step by step, it changes into a frog. This big change is called <b>metamorphosis</b>.</p></div>' +
      '<div class="card"><h3>Life cycle of a frog</h3>' + lcHTML('lc-frog', ['frog']) + '</div>' +
      remember('Frogspawn, then tadpole, then frog. Gills first, lungs later. The change is metamorphosis.') + '</section>' +

      /* insects */
      '<section class="lsec t-coral" id="l-insects">' + head('Idea 5', 'Insects') + sc('insects') +
      '<div class="card"><p>All insects lay eggs. Some insects have 3 stages in their life cycle and some have 4.</p></div>' +
      '<div class="cmp"><div class="t-coral"><h4>3 stages</h4><ul><li>Cockroach, grasshopper</li><li>Egg, nymph, adult</li><li>The nymph looks like its parent but has no wings.</li><li>It sheds its old skin many times. This is <b>moulting</b>.</li></ul></div>' +
      '<div class="t-violet"><h4>4 stages</h4><ul><li>Butterfly, housefly</li><li>Egg, larva, pupa, adult</li><li>The larva (caterpillar) eats and grows.</li><li>The pupa is inside a silky <b>cocoon</b>.</li></ul></div></div>' +
      '<div class="card"><h3>Watch the life cycles</h3>' + lcHTML('lc-insect', ['cockroach', 'butterfly']) + '</div>' +
      remember('A butterfly\'s body changes completely, so it shows metamorphosis too.') + '</section>' +

      /* reptiles */
      '<section class="lsec t-green" id="l-reptiles">' + head('Idea 6', 'Reptiles') + sc('reptiles') +
      '<div class="card"><p>Snakes, turtles, lizards and crocodiles are <b>reptiles</b>. They dig a hole in the ground and lay their eggs in it. The shells of crocodile and turtle eggs are very hard and do not break easily.</p><p style="margin-top:10px">Some reptiles leave the eggs to hatch on their own. But a crocodile is a caring parent. The mother guards her eggs and looks after the babies when they hatch.</p></div>' +
      '<div class="tiles">' + [['🐍', 'Snake'], ['art:turtle', 'Turtle'], ['🦎', 'Lizard'], ['🐊', 'Crocodile']].map(function (t) { return '<div class="tile"><span class="e">' + tileE(t[0]) + '</span>' + t[1] + '</div>'; }).join('') + '</div>' +
      remember('Reptiles lay eggs in a hole in the ground. The crocodile is a caring parent.') + '</section>' +

      /* mammals */
      '<section class="lsec t-blue" id="l-mammals">' + head('Idea 7', 'Mammals: animals that give birth') + sc('mammals') +

      '<div class="tiles">' + [['🧑‍🤝‍🧑', 'Humans'], ['🐱', 'Cats'], ['🐶', 'Dogs'], ['🐬', 'Dolphins'], ['🦇', 'Bats'], ['🐇', 'Rabbits'], ['🐴', 'Horses'], ['🐘', 'Elephants'], ['🐒', 'Monkeys'], ['🐻', 'Bears']].map(function (t) { return '<div class="tile"><span class="e">' + t[0] + '</span>' + t[1] + '</div>'; }).join('') + '</div>' +
      '<div class="cmp"><div class="t-blue"><h4>Water mammals 🐋</h4><p>Whales and dolphins live in water. They have no hair but breathe with lungs. They come up to the surface and breathe air through a <b>blowhole</b> on top of the head.</p></div>' +
      '<div class="t-sun"><h4>Bats 🦇</h4><p>Bats are the only mammals that can fly.</p></div></div>' +
      '<div class="card"><h3>How mammals look after their babies</h3><ul class="bul" style="margin-top:8px"><li>They feed the babies their own milk.</li><li>They keep them warm with their body.</li><li>They protect them from predators.</li><li>They teach them how to hunt for food.</li><li>They look after them for a long time. A baby chimpanzee can stay with its mother for up to 4 years. A baby rat leaves after about 3 weeks.</li></ul></div>' +
      '<div class="card t-sun tint"><h3>Marsupials 🦘</h3><p style="margin-top:6px">Some mammals carry their babies in a <b>pouch</b> on their body. They are called <b>marsupials</b>. A kangaroo keeps its baby in its pouch. A koala keeps its baby in the pouch for about the first six months. After that, the baby rides on its back or clings to its parent.</p></div>' +
      remember('Mammals give birth, feed milk, have hair and breathe with lungs. They care for babies for a long time.') + '</section>' +

      /* words */
      '<section class="lsec t-violet" id="l-words">' + head('Key words', 'Words to remember') +
      '<div class="words">' + D.KEYWORDS.map(function (k) { return '<div class="card word"><h4>' + k[0] + '</h4><p>' + k[1] + '</p><p class="kid">In simple words: ' + k[2] + '</p></div>'; }).join('') + '</div></section>' +

      /* story */
      '<section class="lsec t-sun" id="l-story">' + head('Connect to life', 'Cocoon and the Butterfly') +
      '<div class="card story"><p>Rajan found a caterpillar in the park. He kept it in a jar with leaves and a stick, and watched it every day. The caterpillar built a cocoon. Rajan\'s father told him it would go through metamorphosis and become a butterfly.</p>' +
      '<p>One day Rajan saw the butterfly struggling to get out of a small hole. He felt sorry for it and tore the cocoon to make the hole bigger. The butterfly came out quickly, but its body was swollen and its wings were small. It could never fly.</p>' +
      '<p>Rajan\'s father explained: the struggle pushes fluid from the butterfly\'s body into its wings. That struggle is nature\'s way of making the butterfly strong enough to fly.</p>' +
      '<div class="moral">Moral: Struggles and problems make us stronger.</div></div></section>' +

      /* summary */
      '<section class="lsec t-green" id="l-sum">' + head('Summary', 'Five things to remember') +
      '<div class="card"><ol class="bul" style="padding-left:24px"><li>All living things reproduce so that life continues.</li><li>Animals reproduce in two ways: by giving birth or by laying eggs.</li><li>Birds, fish, turtles, frogs, lizards and insects lay eggs. They are egg-laying animals.</li><li>Animals that give birth and feed milk are mammals, like humans, dogs and dolphins.</li><li>Mammals take care of their young ones for a longer time.</li></ol></div>' +
      '<div class="row"><button class="btn" data-act="go" data-to="qa" style="--c:var(--blue);--on:var(--on-blue)">Open Q &amp; A</button><button class="btn" data-act="go" data-to="quiz" style="--c:var(--coral);--on:var(--on-coral)">Take the quiz</button></div></section>';
  };

  S.INIT.learn = function () {
    showPart('yolk');
    lcInit('lc-hen', 'hen'); lcInit('lc-frog', 'frog'); lcInit('lc-insect', 'cockroach');

  S.ACT.jump = function (t) {
    var el = document.getElementById(t.dataset.to);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

<script>
/* ===== Q & A: every question from the book, with answers ===== */
(function (S) {
  var D = window.SWD, $ = S.$, $$ = S.$$, esc = S.esc;

  function mapAnswer() {
    return '<div class="cmap">' +
      '<div class="cm-top">Reproduction in Animals</div>' +
      '<div class="cm-cols">' +
      '<div class="cm-col"><span class="cm-pill">LAY <b>EGGS</b></span><div class="cm-box">Egg-laying animals</div>' +

      [['BIRDS', 'hen, crow, sparrow'], ['INSECTS', 'cockroach, butterfly, grasshopper, housefly'], ['WATER animals', 'frog, fish'], ['REPTILES', 'snake, turtle, lizard, crocodile']].map(function (c) { return '<div><div class="cm-b">' + c[0] + '</div><div class="cm-ex">' + c[1] + '</div></div>'; }).join('') +
      '</div></div>' +
      '<div class="cm-col"><span class="cm-pill">GIVE <b>BIRTH</b></span><div class="cm-box">Mammals</div><div class="cm-ex">human, cat, dog, dolphin, bat</div></div>' +

  }

  function res(yn, num, art, name) {
    return '<div class="ft-res"><span class="ft-yn ' + yn + '">' + (yn === 'y' ? 'Yes' : 'No') + '</span><div class="ft-card">' + (art.length < 6 ? '<span class="em">' + art + '</span>' : window.ART.svg(art)) + '<span><b>' + num + '</b> ' + name + '</span></div></div>';
  }
  function flowTree() {
    return '<div class="ftree"><div class="ft-q">START: Is it an egg-laying animal?</div><div class="ft-cols">' +
      '<div class="ft-col"><span class="ft-yn y">Yes</span><div class="ft-q s">Does it lay eggs in large clusters that float on water?</div>' + res('y', '2:', 'frog', 'Frog') + res('n', '1:', 'hen', 'Hen') + '</div>' +

  }

  function card(it, n) {
    var h = '<article class="qa card' + (it.extra ? '' : '') + '" data-a="' + (it.o ? it.a : -1) + '">';

      h += '<div class="opts">' + it.o.map(function (o, i) { return '<button class="opt" data-act="qaopt" data-i="' + i + '"><i>' + (it.o.length === 2 && !it.blank ? (i ? 'F' : 'T') : L[i]) + '</i>' + esc(o) + '</button>'; }).join('') + '</div>';
    }
    h += '<div class="qa-a"><b class="lab">Answer</b>';
    if (it.o) h += '<p class="ans">' + esc(it.o[it.a]) + '</p>' + (it.why ? '<p>' + esc(it.why) + '</p>' : '');
    else if (it.map) h += mapAnswer();
    else if (it.match) h += '<div class="pairs">' + it.match.map(function (m) { return '<div class="pair"><span class="e">' + m[0] + '</span>' + m[1] + ' → <b>' + m[2] + '</b></div>'; }).join('') + '</div>';
    else if (it.flow) h += flowTree();
    else if (it.list) h += '<ul class="bul">' + it.list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    else if (it.table) h += '<div class="tbl"><table><thead><tr>' + it.table[0].map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      it.table.slice(1).map(function (r) { return '<tr>' + r.map(function (c, i) { return (i === 0 ? '<th scope="row">' : '<td>') + esc(c) + (i === 0 ? '</th>' : '</td>'); }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    else h += '<p class="ans">' + esc(it.a) + '</p>';
    h += '</div>';
    h += '<div><button class="btn ghost sm" data-act="qatoggle">Show answer</button></div></article>';
    return h;
  }

  function setOpen(c, open) {
    c.classList.toggle('open', open);
    var b = $('[data-act="qatoggle"]', c); if (b) b.textContent = open ? 'Hide answer' : 'Show answer';
    var bl = $('[data-blank]', c);
    var a = +c.dataset.a;
    if (open && a >= 0) {
      $$('.opt', c).forEach(function (o, i) { if (i === a) o.classList.add('right'); });
      if (bl) bl.textContent = $$('.opt', c)[a].textContent.replace(/^[A-Z]/, '');
    } else {
      $$('.opt', c).forEach(function (o) { o.classList.remove('right', 'wrong'); });
      if (bl) bl.innerHTML = '&nbsp;';

  S.VIEWS.qa = function () {

    var n = 0;

      '<div class="sec-head"><p class="eyebrow">Questions and Answers</p><h1>Your whole book, answered</h1>' +
      '<p class="lead">All ' + total + ' questions from the chapter are here. Try to answer first, then tap <b>Show answer</b>. For choice questions, tap an option to test yourself.</p></div>' +
      '<div class="row"><button class="btn" id="qaAll" data-act="qaall">Show all answers</button></div>' +
      '<div class="chips" id="qaChips"><button class="chip" data-act="qafilter" data-g="all" aria-pressed="true">All</button>' +
      D.QA.map(function (g) { return '<button class="chip" data-act="qafilter" data-g="' + g.id + '" aria-pressed="false">' + esc(g.title.replace(/^[IV]+\.\s*([A-D]\.\s*)?/, '')) + '</button>'; }).join('') + '</div>' +
      D.QA.map(function (g) {
        return '<section class="qa-group t-' + g.color + '" data-group="' + g.id + '"><div class="sec-head"><h2>' + esc(g.title) + '</h2><p class="muted">' + esc(g.sub) + '</p></div>' +
          g.items.map(function (it) { n++; return card(it, it.extra ? '+' : n); }).join('') + '</section>';
      }).join('');
  };

  S.INIT.qa = function () { allOpen = false; };

  S.ACT.qatoggle = function (t) { var c = t.closest('.qa'); setOpen(c, !c.classList.contains('open')); };
  S.ACT.qaopt = function (t) {
    var c = t.closest('.qa'), a = +c.dataset.a, i = +t.dataset.i;
    setOpen(c, true);
    if (i !== a) t.classList.add('wrong');
  };
  S.ACT.qaall = function (t) {
    allOpen = !allOpen;
    $$('.qa').forEach(function (c) { setOpen(c, allOpen); });
    t.textContent = allOpen ? 'Hide all answers' : 'Show all answers';
  };
  S.ACT.qafilter = function (t) {
    var g = t.dataset.g;
    $$('#qaChips .chip').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); });
    $$('.qa-group').forEach(function (s) { s.hidden = !(g === 'all' || s.dataset.group === g); });
  };
})(window.SW);
</script>
<script>
/* ===== QUIZ: MCQ on the chapter ===== */
(function (S) {

      return '<p class="muted"><b>Riddle ' + (st.i + 1) + ' of ' + D.RIDDLES.length + '</b></p><p class="q-text">' + esc(r.q) + '</p>' +
        '<div class="rid"><label class="sr" for="rin">Your answer</label><input type="text" id="rin" autocomplete="off" placeholder="Type your answer" value="' + (solved ? esc(r.show) : '') + '"><p class="msg' + (solved ? ' ok' : '') + '" id="rmsg">' + (solved ? 'Correct!' : '') + '</p>' +
        '<div class="row"><button class="btn" data-act="rcheck">Check</button><button class="btn ghost" data-act="rhint">Hint</button><button class="btn ghost" data-act="rshow">Show answer</button></div></div>' +
        '<div class="row" style="justify-content:space-between"><button class="btn ghost sm" data-act="rprev"' + (st.i === 0 ? ' disabled style="opacity:.4"' : '') + '>Back</button><button class="btn ghost sm" data-act="rnext"' + (st.i === D.RIDDLES.length - 1 ? ' disabled style="opacity:.4"' : '') + '>Next riddle</button></div>';
    },
    init: function () { var i = $('#rin'); if (i) i.addEventListener('keydown', function (e) { if (e.key === 'Enter') S.ACT.rcheck(); }); }
  };
  var norm = function (s) { return s.toLowerCase().replace(/[^a-z ]/g, '').trim(); };
  S.ACT.rcheck = function () {
    var r = D.RIDDLES[st.i], v = norm($('#rin').value), m = $('#rmsg');
    if (!v) { m.className = 'msg hint'; m.textContent = 'Type something first.'; return; }
    if (r.a.indexOf(v) >= 0) { st.got[st.i] = true; m.className = 'msg ok'; m.textContent = 'Correct! ' + r.show + '.'; S.celebrate(); }
    else if (r.near && r.near[v]) { m.className = 'msg hint'; m.textContent = r.near[v]; }
    else { m.className = 'msg no'; m.textContent = 'Not yet. Try again or tap Hint.'; }
  };
  S.ACT.rhint = function () { var r = D.RIDDLES[st.i], m = $('#rmsg'); m.className = 'msg hint'; m.textContent = 'It starts with "' + r.show[0] + '" and has ' + r.show.replace(/ \(.*\)/, '').length + ' letters.'; };
  S.ACT.rshow = function () { var r = D.RIDDLES[st.i], m = $('#rmsg'); $('#rin').value = r.show; m.className = 'msg hint'; m.textContent = 'The answer is ' + r.show + '.'; };
  S.ACT.rnext = function () { if (st.i < D.RIDDLES.length - 1) { st.i++; redraw(); } };
  S.ACT.rprev = function () { if (st.i > 0) { st.i--; redraw(); } };

  /* ---------- 6. Animal Detective (flowchart) ---------- */
  var FLOW = {
    q1: { q: 'Is it an egg-laying animal?', y: 'q2', n: 'q3' },
    q2: { q: 'Does it lay eggs in large clusters that float on water?', y: 'a:Frog 🐸', n: 'a:Hen 🐔' },
    q3: { q: 'It is a mammal. Does it have hair on its body?', y: 'a:Dog 🐶', n: 'a:Whale 🐋' }
  };
  GM.detect = {
    start: function () { st = { node: 'q1', trail: [] }; },
    html: function () {
      var nd = st.node;
      if (nd.indexOf('a:') === 0) {
        var a = nd.slice(2); setTimeout(S.celebrate, 100);
        return '<p class="muted">Your animal is...</p><div class="big-e">' + a.split(' ')[1] + '</div><h2 style="text-align:center">' + a.split(' ')[0] + '!</h2>' +
          '<div class="fb ok"><b>How I guessed</b>' + st.trail.map(function (t) { return esc(t); }).join(' → ') + '</div><div class="row" style="justify-content:center"><button class="btn" data-act="detagain">Play again</button></div>';
      }
      return '<p class="muted">Think of one animal: <b>Whale, Frog, Hen or Dog</b>. Do not tell me. Answer my questions.</p><p class="det-q">' + esc(FLOW[nd].q) + '</p>' +
        '<div class="two"><button class="btn choice" data-act="detans" data-v="y">Yes</button><button class="btn choice" data-act="detans" data-v="n" style="--c:var(--coral);--on:var(--on-coral)">No</button></div>';
    }
  };
  S.ACT.detans = function (t) { var f = FLOW[st.node]; st.trail.push(f.q.replace('It is a mammal. ', '') + ' ' + (t.dataset.v === 'y' ? 'Yes' : 'No')); st.node = f[t.dataset.v]; redraw(); };
  S.ACT.detagain = function () { GM.detect.start(); redraw(); };

  /* ---------- 7. Egg-hunt expedition ---------- */
  var HUNT = ['A bird\'s nest', 'Bird eggs in a nest (look only!)', 'Insect eggs on a stem or leaf', 'Frogspawn in a pond (look only!)', 'A caterpillar on a leaf', 'A butterfly', 'A tadpole'];
  GM.hunt = {
    start: function () { st = { found: S.store.get('hunt', {}), note: S.store.get('huntNote', '') }; },
    html: function () {
      var n = HUNT.filter(function (x, i) { return st.found[i]; }).length;
      return '<p>Visit a nearby park with a grown-up. Look for nests and eggs of birds. Insect eggs can be found on stems or leaves. If there is a pond, look for frogs\' eggs. <b>Do not touch the eggs.</b></p>' +
        '<h3>I found... (' + n + ' of ' + HUNT.length + ')</h3><div style="display:flex;flex-direction:column;gap:8px">' +
        HUNT.map(function (x, i) { return '<label class="check"><input type="checkbox" data-act="huntcheck" data-i="' + i + '"' + (st.found[i] ? ' checked' : '') + '>' + esc(x) + '</label>'; }).join('') + '</div>' +
        '<h3>My notebook</h3><label class="sr" for="hnote">Notes</label><textarea class="notes" id="hnote" rows="4" placeholder="What did you see? Where? Write it here and in your Science notebook.">' + esc(st.note) + '</textarea>' +
        '<p class="muted" style="font-size:14px">Saved on this device only.</p>';
    },
    init: function () { $('#hnote').addEventListener('input', function (e) { st.note = e.target.value; S.store.set('huntNote', st.note); }); }
  };
  document.addEventListener('change', function (e) {
    var t = e.target; if (t.dataset && t.dataset.act === 'huntcheck') {
      st.found[t.dataset.i] = t.checked; S.store.set('hunt', st.found);
      var h = $('#gbody h3'); var n = HUNT.filter(function (x, i) { return st.found[i]; }).length;
      var hs = $$('#gbody h3'); if (hs[0]) hs[0].textContent = 'I found... (' + n + ' of ' + HUNT.length + ')';
    }
  });
})(window.SW);
</script>
<script>window.SW.boot();</script>

</body></html>
